name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The grid spikes need WebKitGTK / windowing libraries; the driver does not.
      - run: cargo test -p rsfbclient-core -p rsfbclient-rust -p fb-core -p fb-meta -p fb-probe

  app:
    name: app (UI + Tauri backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      # Typecheck and build the UI first: the backend embeds ui/dist.
      - run: npm ci && npm run build
        working-directory: ui
      - run: cargo test -p n-studio

  firebird:
    name: Firebird ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "2.5"
            service: fb25
            port: 3050
            isql: /usr/local/firebird/bin/isql
            db: /firebird/data/fixture.fdb
            seeds: 00-fixture.sql
          - version: "3.0"
            service: fb30
            port: 3053
            isql: /opt/firebird/bin/isql
            db: /var/lib/firebird/data/fixture.fdb
            seeds: 00-fixture.sql 10-fb3.sql
          - version: "3.0 (Srp)"
            service: fb30srp
            port: 3056
            isql: /opt/firebird/bin/isql
            db: /var/lib/firebird/data/fixture.fdb
            seeds: 00-fixture.sql 10-fb3.sql
          - version: "4.0"
            service: fb40
            port: 3054
            isql: /opt/firebird/bin/isql
            db: /var/lib/firebird/data/fixture.fdb
            seeds: 00-fixture.sql 10-fb3.sql 20-fb4.sql
          - version: "5.0"
            service: fb50
            port: 3055
            isql: /opt/firebird/bin/isql
            db: /var/lib/firebird/data/fixture.fdb
            seeds: 00-fixture.sql 10-fb3.sql 20-fb4.sql
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Start Firebird
        run: docker compose -f docker/compose.yml up -d ${{ matrix.service }}

      # Build while the server starts.
      - run: cargo build -p fb-probe --bin fb-probe && cargo test --no-run -p fb-core -p fb-meta

      - name: Wait for the fixture database
        run: |
          for _ in $(seq 60); do
            if echo "select 1 from rdb\$database;" | docker compose -f docker/compose.yml exec -T ${{ matrix.service }} \
                 ${{ matrix.isql }} -q -user SYSDBA -password masterkey localhost:${{ matrix.db }} >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker/compose.yml logs ${{ matrix.service }}
          exit 1

      - name: Seed the fixture
        run: |
          for f in ${{ matrix.seeds }}; do
            echo "── $f"
            docker compose -f docker/compose.yml exec -T ${{ matrix.service }} \
              ${{ matrix.isql }} -q -bail -ch UTF8 -user SYSDBA -password masterkey \
              -i /seed/$f localhost:${{ matrix.db }}
          done
          echo "execute procedure P_SEED_BULK 100000; commit;" | docker compose -f docker/compose.yml exec -T ${{ matrix.service }} \
            ${{ matrix.isql }} -q -bail -user SYSDBA -password masterkey localhost:${{ matrix.db }}

      - name: Probe
        env:
          FB_HOST: localhost
          FB_PORT: ${{ matrix.port }}
          FB_DB: ${{ matrix.db }}
          FB_USER: SYSDBA
          FB_PASS: masterkey
        # A driver that waits on a reply that never comes hangs, not fails
        timeout-minutes: 5
        run: |
          target/debug/fb-probe --bulk 100000
          target/debug/fb-probe --perf 'select count(*) from rdb$relations'

      - name: Live tests
        env:
          FB_HOST: localhost
          FB_PORT: ${{ matrix.port }}
          FB_DB: ${{ matrix.db }}
          FB_USER: SYSDBA
          FB_PASS: masterkey
          FB_FIXTURE: "1"
        timeout-minutes: 5
        run: cargo test -p fb-core -p fb-meta --test live

      - name: Server log
        if: failure()
        run: docker compose -f docker/compose.yml logs ${{ matrix.service }}
