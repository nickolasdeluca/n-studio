[workspace]
resolver = "2"
members = [
    "crates/fb-core",
    "crates/fb-wire",
    "spikes/fb-probe",
    "spikes/grid-shell/src-tauri",
    "spikes/grid-slint",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nickolasdeluca/fbexpert"

[workspace.dependencies]
rsfbclient = { version = "0.27", default-features = false }
rsfbclient-core = "0.27"
rsfbclient-rust = "0.27"
rsfbclient-native = "0.27"
anyhow = "1"
thiserror = "2"

# M0: vendored copies of the pure-Rust wire driver and its core types, so we can
# instrument them and add what they lack (op_info_sql, op_info_database,
# op_cancel, services, exact decimals, Firebird 4 types). Upstreamed as PRs
# where they land; this patch is how they ship until then.
[patch.crates-io]
rsfbclient-rust = { path = "crates/fb-wire" }
rsfbclient-core = { path = "crates/fb-wire-core" }
