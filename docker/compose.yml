# Firebird version matrix for N Studio integration tests.
#
#   docker compose -f docker/compose.yml up -d
#
# Ports map version -> host port so the probe can hit all four at once:
#   2.5 -> 3050   3.0 -> 3053   4.0 -> 3054   5.0 -> 3055
#   3.0 with its default auth (Srp, wire encryption on) -> 3056
#
# 2.5 comes from jacobalberty/firebird; the official firebirdsql/firebird
# images only go back to 3.0. Tags are major versions: latest patch of each.
services:
  fb25:
    image: jacobalberty/firebird:2.5-ss
    ports: ["3050:3050"]
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: fixture.fdb
      EnableLegacyClientAuth: "true"
    volumes:
      - ./seed:/seed:ro

  fb30:
    image: firebirdsql/firebird:3
    ports: ["3053:3050"]
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: fixture.fdb
      FIREBIRD_USE_LEGACY_AUTH: "true"
    volumes:
      - ./seed:/seed:ro

  # fb30 above is set up the way 2.5-era applications need it (Legacy_Auth,
  # no wire encryption); this one keeps 3.0's defaults.
  fb30srp:
    image: firebirdsql/firebird:3
    ports: ["3056:3050"]
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: fixture.fdb
    volumes:
      - ./seed:/seed:ro

  fb40:
    image: firebirdsql/firebird:4
    ports: ["3054:3050"]
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: fixture.fdb
    volumes:
      - ./seed:/seed:ro

  fb50:
    image: firebirdsql/firebird:5
    ports: ["3055:3050"]
    environment:
      FIREBIRD_ROOT_PASSWORD: masterkey
      FIREBIRD_DATABASE: fixture.fdb
    volumes:
      - ./seed:/seed:ro
