[package]
name = "grid-slint"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
slint = "1.18.1"
serde_json = "1"
rand = "0.8"

[features]
# Skia renderer (Metal on macOS), selected at run time with
# SLINT_BACKEND=winit-skia. Its build downloads prebuilt Skia binaries.
skia = ["slint/renderer-skia"]

[build-dependencies]
slint-build = "1.18.1"
