[package]
name = "fb-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# `cargo run -p fb-probe` is the probe; the handshake dumper is asked for by name
default-run = "fb-probe"

[dependencies]
rsfbclient = { workspace = true, features = ["pure_rust"] }
rsfbclient-core = { workspace = true }
# The vendored crates/fb-wire, via [patch.crates-io]: --perf drives it directly.
rsfbclient-rust = { workspace = true }
anyhow = { workspace = true }

[features]
# Enables the native-client backend so we can compare capability surfaces.
native = ["rsfbclient/dynamic_loading"]
